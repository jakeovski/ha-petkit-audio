api:
  listen: ":1984"

rtsp:
  listen: ":8554"

log:
  level: info

streams:
  # go2rtc runs this on demand. The publisher emits silence from the moment it
  # starts, before the Agora channel is joined, so the stream is servable in
  # about a second instead of waiting ~15s for the handshake - which matters
  # because go2rtc dials every source of the combined stream before serving the
  # video.
  petkit_audio: exec:/app/audio_pipe.sh {output}
