api:
  listen: ":1984"

rtsp:
  listen: ":8554"

log:
  level: info

# No stream is declared here on purpose. The publisher pushes into go2rtc over
# RTSP and go2rtc creates "petkit_audio" itself, so the stream is already live
# when Home Assistant asks for it. Starting the Agora join on demand instead
# made every consumer wait ~15s for the channel handshake - and because the
# camera now points at a stream combining this with the video, that delay was
# blocking the video too.
streams: {}
